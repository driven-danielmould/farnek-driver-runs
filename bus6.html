const u8=(s)=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha(s){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,24);}
let tries=0;
document.getElementById('f').addEventListener('submit', async (ev)=>{ ev.preventDefault(); const e=document.getElementById('e'), b=document.getElementById('b'); e.textContent=''; b.disabled=true;
  try { tries++; if (tries>5) await new Promise(r=>setTimeout(r,3000*(tries-5)));
    const name=document.getElementById('n').value.trim().toLowerCase(), pw=document.getElementById('p').value;
    const w=WRAPS[await sha(name)]; if(!w) throw 0;
    const km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(w.s),iterations:600000,hash:'SHA-256'}, km, {name:'AES-GCM',length:256}, false, ['decrypt']);
    const K=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(w.i)}, kek, u8(w.w));
    const key=await crypto.subtle.importKey('raw', K, 'AES-GCM', false, ['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)}, key, u8(CT));
    const html=new TextDecoder().decode(pt); document.open(); document.write(html); document.close(); }
  catch(err) { e.textContent='That username and PIN did not match.'; b.disabled=false; } });
